<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dost — आपका बातचीत साथी</title>
<style>
  :root{
    --bg: #14110F;
    --panel: #1D1916;
    --panel-2: #26211D;
    --accent: #E8A33D;
    --accent-soft: #4A3B22;
    --text: #F1EAE0;
    --text-dim: #A99C8C;
    --user-bubble: #E8A33D;
    --user-text: #1A1410;
    --bot-bubble: #2A2420;
    --border: #362E27;
    --danger: #C25450;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Noto Sans Devanagari', system-ui, sans-serif;
  }
  .app{
    display:flex; flex-direction:column;
    height:100vh; max-width:720px; margin:0 auto;
    background: var(--panel);
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px;
    background: var(--panel-2);
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), #B5722A);
    display:flex;align-items:center;justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  header .info h1{ margin:0; font-size:17px; font-weight:600; letter-spacing:0.2px;}
  header .info p{ margin:2px 0 0; font-size:12.5px; color: var(--text-dim); }
  .status-dot{ width:8px;height:8px;border-radius:50%; background:#5FBF6B; display:inline-block; margin-left:6px;}
  .status-dot.off{ background:#8A8478; }

  #setup{
    padding:18px 20px; border-bottom:1px solid var(--border);
    background: var(--panel-2);
  }
  #setup label{ font-size:13px; color:var(--text-dim); display:block; margin-bottom:6px;}
  #setup .row{ display:flex; gap:8px; }
  #setup input[type=password], #setup input[type=text]{
    flex:1; padding:10px 12px; border-radius:8px;
    border:1px solid var(--border); background: var(--bg); color: var(--text);
    font-size:14px; outline:none;
  }
  #setup input:focus{ border-color: var(--accent); }
  #setup button{
    padding:10px 16px; border-radius:8px; border:none;
    background: var(--accent); color:#1A1410; font-weight:600; cursor:pointer;
    font-size:14px;
  }
  #setup button:hover{ filter:brightness(1.08); }
  #setup .hint{ margin-top:8px; font-size:12px; color: var(--text-dim); line-height:1.5;}
  #setup .hint a{ color: var(--accent); }
  #setup.hidden{ display:none; }

  #messages{
    flex:1; overflow-y:auto; padding:18px 16px;
    display:flex; flex-direction:column; gap:12px;
  }
  .msg{ max-width:78%; padding:10px 14px; border-radius:14px; font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word;}
  .msg.user{ align-self:flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius:4px;}
  .msg.bot{ align-self:flex-start; background: var(--bot-bubble); color: var(--text); border-bottom-left-radius:4px; border:1px solid var(--border);}
  .msg.system{ align-self:center; background:transparent; color: var(--text-dim); font-size:12.5px; text-align:center; max-width:90%;}
  .typing{ align-self:flex-start; display:flex; gap:4px; padding:12px 14px; background: var(--bot-bubble); border-radius:14px; border:1px solid var(--border);}
  .typing span{ width:6px;height:6px;border-radius:50%; background: var(--text-dim); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  #composer{
    display:flex; gap:10px; padding:14px 16px;
    border-top:1px solid var(--border); background: var(--panel-2);
  }
  #composer textarea{
    flex:1; resize:none; max-height:120px; min-height:44px;
    padding:11px 14px; border-radius:12px; border:1px solid var(--border);
    background: var(--bg); color: var(--text); font-size:14.5px; outline:none;
    font-family:inherit; line-height:1.4;
  }
  #composer textarea:focus{ border-color: var(--accent); }
  #composer button{
    width:44px;height:44px; border-radius:50%; border:none;
    background: var(--accent); color:#1A1410; cursor:pointer;
    font-size:18px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  #composer button:disabled{ opacity:0.4; cursor:not-allowed; }
  #composer button:hover:not(:disabled){ filter:brightness(1.08); }

  .modebar{
    display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap;
  }
  .modebar button{
    font-size:12px; padding:6px 12px; border-radius:20px;
    border:1px solid var(--border); background: var(--panel-2); color: var(--text-dim);
    cursor:pointer;
  }
  .modebar button.active{ background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🙂</div>
    <div class="info">
      <h1>AI Dost <span class="status-dot off" id="statusDot"></span></h1>
      <p id="statusText">कनेक्ट होने का इंतज़ार है...</p>
    </div>
  </header>

  <div id="setup">
    <label for="apiKey">Groq API Key डालें (फ्री):</label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off">
      <button id="connectBtn">कनेक्ट करें</button>
    </div>
    <div class="hint">
      फ्री API key यहाँ से बनाएं: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a> — साइनअप/लॉगिन करें, "Create API Key" दबाएं, और key यहाँ paste करें। यह key सिर्फ़ आपके ब्राउज़र में रहती है, कहीं सेव नहीं होती।
    </div>
  </div>

  <div class="modebar" id="modebar">
    <button data-mode="friend" class="active">😊 दोस्त की तरह</button>
    <button data-mode="interview">🎤 इंटरव्यू लो</button>
    <button data-mode="teacher">📘 सिखाओ / समझाओ</button>
    <button data-mode="default">💬 सामान्य</button>
  </div>

  <div id="messages">
    <div class="msg system">ऊपर अपनी फ्री API key डालकर "कनेक्ट करें" दबाएं, फिर बात शुरू करें।</div>
  </div>

  <div id="composer">
    <textarea id="userInput" placeholder="कुछ भी पूछिए या बात कीजिए..." rows="1" disabled></textarea>
    <button id="sendBtn" disabled>➤</button>
  </div>
</div>

<script>
  const state = {
    apiKey: null,
    mode: 'friend',
    history: [] // {role: 'user'|'model', text: ''}
  };

  const modePrompts = {
    friend: "तुम एक गर्मजोशी भरे, मज़ाकिया, सच्चे दोस्त की तरह बात करते हो। Hinglish (हिंदी-अंग्रेज़ी मिली-जुली भाषा) में, casual और अपनापन भरे टोन में जवाब दो। छोटे, नेचुरल जवाब दो जैसे कोई दोस्त चैट पर बात करता है। ज़्यादा औपचारिक मत बनो।",
    interview: "तुम एक इंटरव्यूअर हो। यूज़र से एक-एक करके सवाल पूछो — उनकी पिछली बात के आधार पर अगला सवाल बनाओ। विषय पूछो कि किस चीज़ पर इंटरव्यू चाहिए (जैसे उनकी नौकरी, कोई स्किल, कोई अनुभव), फिर उसी पर गहराई से सवाल पूछते जाओ। एक बार में सिर्फ़ एक सवाल पूछो।",
    teacher: "तुम एक धैर्यवान शिक्षक की तरह हो। जो भी सवाल पूछा जाए, उसे आसान भाषा में, उदाहरण देकर समझाओ। ज़रूरत पड़े तो पूछो कि यूज़र की समझ किस स्तर की है।",
    default: "तुम एक मददगार, सीधा-सादा AI सहायक हो। साफ़ और उपयोगी जवाब दो।"
  };

  const messagesEl = document.getElementById('messages');
  const apiKeyInput = document.getElementById('apiKey');
  const connectBtn = document.getElementById('connectBtn');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const setupPanel = document.getElementById('setup');
  const modebar = document.getElementById('modebar');

  function addMessage(text, role){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping(){
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  connectBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if(!key){
      alert('कृपया पहले API key डालें।');
      return;
    }
    state.apiKey = key;
    try{ localStorage.setItem('ai_dost_groq_key', key); }catch(e){}
    statusDot.classList.remove('off');
    statusText.textContent = 'कनेक्ट हो गया — बात शुरू करें';
    userInput.disabled = false;
    sendBtn.disabled = false;
    setupPanel.classList.add('hidden');
    addMessage('कनेक्शन तैयार है! अब जो चाहे पूछो या बात करो 🙂', 'bot');
    userInput.focus();
  });

  // पिछली सेव की हुई key अपने-आप भर देना और कनेक्ट कर देना
  window.addEventListener('DOMContentLoaded', () => {
    try{
      const saved = localStorage.getItem('ai_dost_groq_key');
      if(saved){
        apiKeyInput.value = saved;
        connectBtn.click();
      }
    }catch(e){}
  });

  modebar.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    [...modebar.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    state.history = []; // reset context on mode switch
    addMessage('मोड बदल दिया: ' + btn.textContent, 'system');
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage(){
    const text = userInput.value.trim();
    if(!text || !state.apiKey) return;
    addMessage(text, 'user');
    state.history.push({role:'user', text});
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try{
      const reply = await callGemini();
      hideTyping();
      addMessage(reply, 'bot');
      state.history.push({role:'model', text: reply});
    }catch(err){
      hideTyping();
      addMessage('माफ़ करें, कुछ गड़बड़ हो गई: ' + err.message, 'system');
    }finally{
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  async function callGemini(){
    const url = `https://api.groq.com/openai/v1/chat/completions`;

    const messages = [
      { role: 'system', content: modePrompts[state.mode] },
      ...state.history.map(m => ({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.text
      }))
    ];

    const body = {
      model: 'llama-3.1-8b-instant',
      messages: messages
    };

    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.apiKey}`
      },
      body: JSON.stringify(body)
    });

    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData?.error?.message || ('HTTP ' + res.status));
    }

    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content;
    if(!text) throw new Error('खाली जवाब मिला, दोबारा कोशिश करें।');
    return text.trim();
  }
</script>
</body>
</html>
